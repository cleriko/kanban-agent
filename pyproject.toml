[project]
name = "workconsole-agent"
version = "1.0.0"
description = "Transcription and meeting-analysis worker for the macOS work console"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "faster-whisper>=1.1.0",
    "langchain-core>=0.3.29",
    "langgraph>=0.2.60",
]

[project.optional-dependencies]
whisper = []   # kept so `pip install ".[whisper]"` still works
# Optional cloud provider. Off unless explicitly selected; nothing uses it by default.
gemini = ["langchain-google-genai>=2.0.8"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
