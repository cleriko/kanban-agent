# ---------------------------------------------------------------------------
# Optional local/alternative deployment for the worker-only repository.
#
# The documented path is a Dokploy **Application** built from this repo's
# Dockerfile with no domain (see README). This compose file is for running the
# same image outside Dokploy: it expects the same Postgres and the same object
# directory the API uses.
#
#   WC_DATABASE_URL=postgresql+asyncpg://USER:PASSWORD@HOST:5432/DB
#   WC_GEMINI_API_KEY=...
#   docker compose up -d --build
# ---------------------------------------------------------------------------
services:
  worker:
    build: .
    restart: unless-stopped
    # Finishing a transcription takes minutes; do not kill it on shutdown.
    stop_grace_period: 2m
    env_file:
      - path: .env
        required: false
    environment:
      # Must be the same host path as the API's mount, or every job fails with a
      # missing file while both containers look healthy.
      WC_STORAGE_PATH: /var/lib/workconsole/objects
      WC_RUN_MIGRATIONS: "false"
    volumes:
      - /var/lib/workconsole/objects:/var/lib/workconsole/objects
      - /var/lib/workconsole/models:/var/lib/workconsole/models
